plugins {
    id 'com.android.library'
}

android {
    namespace 'com.east.android.zlive'

    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 28
        ndk { abiFilters "armeabi-v7a" }
    }
}

dependencies {
    // Keep jniLibs/armeabi-v7a/libjnidispatch.so from the AAR of the same JNA release.
    api 'net.java.dev.jna:jna:5.19.1'
}
