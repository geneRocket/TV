plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse('/Users/wuwenjun/.pyenv/shims/python3.8')

android {
    namespace 'com.fongmi.chaquo'

    compileSdk 36
    flavorDimensions = ["abi"]

    defaultConfig {
        minSdk 24
        targetSdk 28
        python {
            buildPython(pythonExecutable)
            version "3.8"
            pip {
                install "lxml"
                install "ujson"
                install "pyquery==2.0.1"
                install "requests"
                install "jsonpath"
                install "pycryptodome"
                install "beautifulsoup4"
            }
        }
    }

    productFlavors {
        x86 {
            dimension "abi"
            ndk { abiFilters "x86" }
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }
}

dependencies {
    implementation project(':catvod')
}

tasks.register('testPythonBridge', Exec) {
    group = 'verification'
    description = 'Checks Python spider module isolation without Android or network access.'
    workingDir projectDir
    commandLine pythonExecutable, '-B', '-m', 'unittest', 'discover', '-s', 'src/test/python', '-v'
}
